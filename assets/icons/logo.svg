<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="beaconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0D9488" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M32 4 L8 14 V32 C8 46.5 18.2 56.8 32 60 C45.8 56.8 56 46.5 56 32 V14 L32 4 Z" 
        fill="url(#shieldGrad)" filter="url(#glow)" />
        
  <!-- Inner Rim -->
  <path d="M32 8 L12 16.5 V32 C12 43.8 20.5 52.5 32 55.4 C43.5 52.5 52 43.8 52 32 V16.5 L32 8 Z" 
        fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />
        
  <!-- Compass Star / Safety Cross -->
  <path d="M32 16 L35.5 27.5 L47 31 L35.5 34.5 L32 46 L28.5 34.5 L17 31 L28.5 27.5 Z" 
        fill="url(#beaconGrad)" />
        
  <!-- Central Core Beacon -->
  <circle cx="32" cy="31" r="5" fill="#FFFFFF" />
  <circle cx="32" cy="31" r="2.5" fill="#0F766E" />
  
  <!-- Radiating Safety Arcs -->
  <path d="M22 21 C27.5 17 36.5 17 42 21" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round" />
  <path d="M19 16 C26.5 11 37.5 11 45 16" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round" />
</svg>
